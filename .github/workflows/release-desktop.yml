name: Release desktop

# Push a tag desktop-vX.Y.Z to build the desktop app and attach it to a
# GitHub release: a universal .dmg for macOS, an AppImage and a .deb for
# Linux. The CLI release (tag vX.Y.Z) stays the latest release. By hand
# (workflow_dispatch) it only builds; the files are kept as artifacts.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            targets: ""
            args: --bundles appimage,deb
            files: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Build
        working-directory: desktop
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}
      - name: Collect
        run: |
          mkdir dist
          cp ${{ matrix.files }} dist/
          cd dist && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done && ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          notes="agent-ws desktop $version: the workspaces of every repository in one window and the menu bar. The app is not signed yet: on macOS, right-click it and choose Open the first time, or run xattr -dr com.apple.quarantine /Applications/agent-ws.app."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "agent-ws desktop $version" --notes "$notes" --latest=false --verify-tag
          fi
