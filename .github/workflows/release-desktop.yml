name: Release desktop

# Push a tag desktop-vX.Y.Z to build the desktop app and attach it to a
# GitHub release: a universal .dmg for macOS, an AppImage and a .deb for
# Linux. The CLI release (tag vX.Y.Z) stays the latest release. By hand
# (workflow_dispatch) it only builds; the files are kept as artifacts.
on:
  push:
    tags: ["desktop-v*"]
  # A change to this workflow builds once in its pull request.
  pull_request:
    paths:
      - ".github/workflows/release-desktop.yml"
      - ".github/actions/setup-desktop/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            target_flag: --target universal-apple-darwin
            bundles: dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            targets: ""
            target_flag: ""
            bundles: appimage,deb
            files: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-desktop
        with:
          rust-targets: ${{ matrix.targets }}
      - name: Build
        working-directory: desktop
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          TARGET_FLAG: ${{ matrix.target_flag }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          # shellcheck disable=SC2086
          npx tauri build $TARGET_FLAG --bundles "$BUNDLES" -- --locked
      - name: Collect
        env:
          FILES: ${{ matrix.files }}
        run: |
          mkdir -p dist
          for pat in $FILES; do
            cp "$pat" dist/
          done
          cd dist && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done && ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          notes="agent-ws desktop $version: the workspaces of every repository in one window and the menu bar. The app is not signed yet: on macOS, right-click it and choose Open the first time, or run xattr -dr com.apple.quarantine /Applications/agent-ws.app."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "agent-ws desktop $version" --notes "$notes" --latest=false --verify-tag
          fi
