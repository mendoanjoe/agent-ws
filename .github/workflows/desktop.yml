name: Desktop

# The desktop app (desktop/): type-check and build the window, lint the Rust
# side, run Rust tests, and bundle it, on macOS and Linux. Runs when the app
# or the library it uses changes.
on:
  push:
    branches: [master]
    paths:
      - "desktop/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
      - ".github/actions/setup-desktop/**"
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
      - ".github/actions/setup-desktop/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bundles: app }
          - { os: ubuntu-latest, bundles: deb }
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-desktop
        with:
          rust-components: clippy
      - run: npx tsc --noEmit
      - run: npm run build
      - run: cargo clippy -p agent-ws-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p agent-ws-desktop --locked
      - env:
          BUNDLES: ${{ matrix.bundles }}
        run: npx tauri build --debug --config '{"build":{"beforeBuildCommand":""}}' --bundles "$BUNDLES" -- --locked
