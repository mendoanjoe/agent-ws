[package]
name = "agent-ws"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Instant, isolated workspaces for coding agents on macOS (APFS clone-on-write)"
license = "MIT"
repository = "https://github.com/mendoanjoe/agent-ws"
readme = "README.md"
keywords = ["git", "worktree", "agent", "apfs", "workspace"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
