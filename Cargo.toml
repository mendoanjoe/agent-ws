[package]
name = "agent-ws"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Instant, isolated workspaces for coding agents: copy-on-write clones on macOS (APFS) and Linux (Btrfs, XFS)"
license = "MIT"
repository = "https://github.com/mendoanjoe/agent-ws"
readme = "README.md"
keywords = ["git", "worktree", "agent", "apfs", "workspace"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.11"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
