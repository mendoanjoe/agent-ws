[package]
name = "agent-ws"
version = "0.1.0"
edition = "2024"
description = "Instant, isolated workspaces for coding agents on macOS (APFS clone-on-write)"
license = "MIT"
repository = "https://github.com/mendoanjoe/agent-ws"
readme = "README.md"
keywords = ["git", "worktree", "agent", "apfs", "workspace"]
categories = ["command-line-utilities", "development-tools::version-control"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
